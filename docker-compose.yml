services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  ollama-model:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama"]
    command: ["pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama

  api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    env_file:
      - Backend/.env
    environment:
      NODE_ENV: development
      PORT: "5001"
      CORS_ORIGINS: http://localhost:3000
      MONGO_URI: mongodb://mongodb:27017
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5001/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: "astrolynx-chatbot Frontend/Dockerfile"
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5001
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mongodb-data:
  ollama-data:
